name: Dependency Security Audit

on:
  push:
    branches: [main]
    paths:
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/Dockerfile'
      - 'contracts/**/Cargo.toml'
      - 'contracts/**/Cargo.lock'
      - 'deny.toml'
      - 'docker-compose.yml'
      - '.env.docker'
      - '.github/npm-audit-allowlist.json'
      - '.github/scripts/check-npm-audit.mjs'
      - '.github/workflows/dependency-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/Dockerfile'
      - 'contracts/**/Cargo.toml'
      - 'contracts/**/Cargo.lock'
      - 'deny.toml'
      - 'docker-compose.yml'
      - '.env.docker'
      - '.github/npm-audit-allowlist.json'
      - '.github/scripts/check-npm-audit.mjs'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Gate production dependencies (no high or critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit full dependency tree
        id: npm_audit
        run: npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true

      - name: Enforce advisory allowlist
        run: |
          node "$GITHUB_WORKSPACE/.github/scripts/check-npm-audit.mjs" \
            --input "$RUNNER_TEMP/npm-audit.json" \
            --allowlist "$GITHUB_WORKSPACE/.github/npm-audit-allowlist.json"

  cargo:
    name: cargo deny (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - escrow
          - retainer

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.1
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/${{ matrix.crate }}/target/
          key: ${{ runner.os }}-cargo-deny-${{ format('contracts/{0}/Cargo.lock', matrix.crate) }}
          restore-keys: |
            ${{ runner.os }}-cargo-deny-

      - name: Check Rust advisories (RUSTSEC)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.0.11
        with:
          manifest-path: contracts/${{ matrix.crate }}/Cargo.toml
          command-arguments: advisories