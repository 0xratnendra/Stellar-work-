name: Contract Fuzzing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sundays

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
        
      - name: Run Fuzzer
        working-directory: ./contracts/escrow
        run: cargo fuzz run full_lifecycle -- -max_total_time=300
        
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: fuzz-crashes
          path: contracts/escrow/fuzz/artifacts/
