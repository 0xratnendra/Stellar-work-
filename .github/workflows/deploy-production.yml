name: Production Deployment

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-production.yml'

concurrency:
  group: production-deployment
  cancel-in-progress: false

# ── Permissions ───────────────────────────────────────────────────────────────
# Minimal baseline. id-token: write is added only to the deploy job so the
# OIDC token is never available to steps that don't need cloud access.
# Vercel does not use OIDC — it uses a long-lived VERCEL_TOKEN stored as a
# secret. That token is scoped to the Vercel project only and cannot access
# the AWS account, so it remains as a secret rather than being federated here.
permissions:
  contents: read

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # The 'production' GitHub Environment gates this job behind a required
    # reviewer. The OIDC trust policy for the apply role checks the environment
    # claim, so even if the workflow file were modified on a branch, the role
    # would reject an assumption attempt that didn't pass the gate.
    environment: production

    permissions:
      contents: read
      # Required to exchange the GitHub OIDC JWT for temporary AWS credentials.
      # Scoped to this job only — not granted at workflow level.
      id-token: write

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_CONTRACT_ID: ${{ secrets.SOROBAN_CONTRACT_ID }}
      NEXT_PUBLIC_NETWORK: testnet
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG || 'stellarwork' }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'stellarwork-frontend' }}
      SENTRY_RELEASE: ${{ github.sha }}
      NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Create Sentry release
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          npx @sentry/cli releases new "${{ github.sha }}"
          npx @sentry/cli releases set-commits "${{ github.sha }}" --auto
          npx @sentry/cli releases finalize "${{ github.sha }}"
          npx @sentry/cli releases deploys "${{ github.sha }}" new --env production
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || 'stellarwork' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'stellarwork-frontend' }}

      # ── AWS access via OIDC ────────────────────────────────────────────────
      # The ECS deploy role is assumed here with short-lived credentials.
      # No AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY are stored anywhere.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: deploy-production-${{ github.run_id }}
          # 30 minutes is sufficient for a deploy; the role's max-session is 1 h.
          role-duration-seconds: 1800

      # ── Vercel deploy (uses project-scoped VERCEL_TOKEN secret) ───────────
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Output deployment URL
        run: echo "Production deployed to ${{ steps.deploy.outputs.url }}"
