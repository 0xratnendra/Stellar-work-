name: Bundle Size Analysis

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/bundle-size.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'

concurrency:
  group: bundle-size-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  bundle-size:
    name: Check Bundle Size
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAHSQ
      NEXT_PUBLIC_NETWORK: testnet

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ── Build PR branch ─────────────────────────────────────────────────
      - name: Build (PR branch)
        run: npm run build

      - name: Check bundle sizes against budgets
        run: node scripts/check-bundle-size.mjs --ci
        continue-on-error: true
        id: budget_check

      - name: Generate size report JSON
        run: node scripts/check-bundle-size.mjs --json > .next/analyze/bundle-size-report.json 2>/dev/null || true

      # ── Build base branch for comparison (PR only) ──────────────────────
      - name: Checkout base branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: _base

      - name: Install base dependencies
        if: github.event_name == 'pull_request'
        run: npm ci
        working-directory: _base/frontend

      - name: Build base branch
        if: github.event_name == 'pull_request'
        run: npm run build
        working-directory: _base/frontend

      - name: Generate base size report
        if: github.event_name == 'pull_request'
        run: node scripts/check-bundle-size.mjs --json > ../../frontend/.next/analyze/base-bundle-size-report.json 2>/dev/null || true
        working-directory: _base/frontend

      # ── Generate PR comment ─────────────────────────────────────────────
      - name: Generate bundle size PR comment
        if: github.event_name == 'pull_request'
        run: node scripts/generate-bundle-report.mjs

      - name: Post bundle size comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.0
        with:
          header: bundle-size
          path: frontend/.next/analyze/bundle-size-comment.md

      # ── Upload artifacts for trend tracking ─────────────────────────────
      - name: Upload bundle size report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: bundle-size-report-${{ github.sha }}
          path: |
            frontend/.next/analyze/bundle-size-report.json
            frontend/.next/analyze/bundle-size-comment.md
          retention-days: 90

      # ── Save baseline on main for future comparisons ────────────────────
      - name: Store baseline report (main branch)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.1
        with:
          path: frontend/.next/analyze/bundle-size-report.json
          key: bundle-size-baseline-${{ github.sha }}

      # ── Fail if budget exceeded ─────────────────────────────────────────
      - name: Enforce budget check result
        if: steps.budget_check.outcome == 'failure'
        run: |
          echo "❌ Bundle size budget exceeded. See the report above for details."
          echo "Run 'npm run analyze' locally to inspect the bundle treemap."
          exit 1
